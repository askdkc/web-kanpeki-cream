<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#63cf6d" />
    <title>完璧なクリーム 3D</title>
    <style>
      #boot-screen {
        position: fixed; inset: 0; z-index: 100; display: grid; place-content: center;
        justify-items: center; gap: 1.2rem; color: #694333; background: #fff6eb;
        font: 650 1rem/1.6 system-ui, sans-serif; text-align: center;
      }
      #boot-screen p { margin: 0; }
      #boot-screen a { color: #8b3354; }
      .cream-drops { display: flex; align-items: end; gap: .55rem; height: 2rem; }
      .cream-drops i {
        width: 1.3rem; height: 1.3rem; border-radius: 75% 12% 65% 55%;
        background: #ef91ab; box-shadow: inset 3px -3px 0 #dc7795;
        transform: rotate(-38deg); animation: cream-bounce 1s ease-in-out infinite;
      }
      .cream-drops i:nth-child(2) { animation-delay: .12s; }
      .cream-drops i:nth-child(3) { animation-delay: .24s; }
      @keyframes cream-bounce {
        0%, 65%, 100% { transform: translateY(0) rotate(-38deg); }
        32% { transform: translateY(-.65rem) rotate(-38deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .cream-drops i { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-screen">
      <div class="cream-drops" aria-hidden="true"><i></i><i></i><i></i></div>
      <p role="status">読み込み中…</p>
      <a href="" hidden>再読み込み</a>
    </div>
    <div id="app" inert>
      <canvas id="stage" aria-label="流れてくるお菓子にクリームを絞る3Dゲーム"></canvas>
      <div id="hud" class="hud" aria-hidden="true">
        <div class="hud-bar">
          <button id="pause" class="round-btn" type="button" aria-label="ポーズ">II</button>
          <div class="hud-center">
            <div class="hud-label"><span id="hudStage">STAGE 1</span></div>
            <div class="bar"><i id="hudTime"></i></div>
          </div>
          <button id="sound" class="round-btn" type="button" aria-label="音の切り替え">♪</button>
        </div>
        <div class="hud-info">
          <div class="hud-score"><span id="hudScore">0</span><span class="unit">てん</span></div>
          <div class="hud-name" id="hudName">はじめてのシュガー</div>
          <div class="hud-combo" id="hudCombo"></div>
        </div>
      </div>
      <div id="ready" class="ready">
        <span class="r-stage" id="readyStage">STAGE 1</span>
        <span class="r-name" id="readyName"></span>
        <span class="r-go" id="readyGo">スタート!</span>
      </div>
      <div id="hint" class="hint">押さえてクリームを出す</div>
      <section id="screens" class="screens" aria-live="polite"></section>
    </div>
    <script type="module">
      const screen = document.getElementById('boot-screen');
      import('/src/main.ts').then(module => module.ready).then(() => {
        document.getElementById('app').inert = false;
        screen.remove();
      }).catch(error => {
        console.error(error);
        screen.querySelector('.cream-drops').remove();
        screen.querySelector('[role="status"]').textContent = 'ゲームを読み込めませんでした。';
        screen.querySelector('a').hidden = false;
      });
    </script>
  </body>
</html>
